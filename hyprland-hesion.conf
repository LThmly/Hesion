# Optional Hyprland binds for Hesion (after ./scripts/install.sh).
#
# Use the full path — Hyprland's exec environment often lacks ~/.local/bin.
#
# bind = SUPER, A, exec, ~/.local/bin/hesion
# bind = ALT SHIFT, SPACE, exec, ~/.local/bin/hesion --compact
#
# Hesion resizes itself via hyprctl when toggling compact mode (relative
# tiled resize so the sibling fills the gap). No extra window rules required.
